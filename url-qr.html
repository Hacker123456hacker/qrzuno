<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website QR Generator — QRZuno</title><link rel="stylesheet" href="css/main.css"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><main class="tools" style="padding-top:70px"><div class="glass" style="padding:30px;border-radius:22px;max-width:900px;margin:auto"><h1>Website <span class="accent">QR Generator</span></h1><p>Enter a URL and create a QR code.</p><form id="qrForm"><input id="url" type="url" required placeholder="https://example.com" style="width:100%;padding:15px;border-radius:10px;border:1px solid #426ba8;background:#071b3c;color:white"><button class="btn primary" style="border:0;margin-top:12px">Generate QR</button></form><div id="qrcode" style="background:white;padding:15px;width:max-content;margin:25px auto"></div><a class="btn ghost" href="index.html">← Home</a></div></main><script>const f=document.getElementById('qrForm'),q=document.getElementById('qrcode');f.addEventListener('submit',e=>{e.preventDefault();q.innerHTML='';new QRCode(q,{text:document.getElementById('url').value,width:240,height:240,colorDark:'#07102a',colorLight:'#ffffff'});});</script></body></html>
